[package]
name = "minigrafsharp-shim"
version = "0.1.0"
edition = "2024"
publish = false
description = "MinigrafSharp-owned prepared-query C ABI shim directly over the pinned minigraf core crate"
license = "Apache-2.0"

[lib]
name = "minigrafsharp_shim"
crate-type = ["cdylib", "staticlib"]

[dependencies]
minigraf = "=2.0.7"
serde_json = "1"
uuid = "1"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
# Same pinned core as the shim itself; used only by the M3.2a
# characterization probes (native/shim/tests/characterization.rs).
minigraf = "=2.0.7"
