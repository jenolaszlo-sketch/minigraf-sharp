name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting gate (one OS is enough: deterministic, toolchain-pinned).
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore MinigrafSharp.slnx
      - run: dotnet format MinigrafSharp.slnx --verify-no-changes --no-restore

  # Per-RID distribution qualification on its own OS: stage + verify the pinned
  # native asset, then run the real-engine suites. Staging uploads as an
  # artifact consumed by the pack job.
  dist:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Stage, verify and qualify ${{ matrix.rid }}
        run: ./eng/Test-Dist.ps1 -Rid ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: staging-${{ matrix.rid }}
          path: native/staging/${{ matrix.rid }}
          if-no-files-found: error

  # Assemble the three-RID package from the exact qualified staging artifacts,
  # verify it, and self-test the verifier.
  pack:
    needs: [dist]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: staging-win-x64
          path: native/staging/win-x64
      - uses: actions/download-artifact@v4
        with:
          name: staging-linux-x64
          path: native/staging/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: staging-osx-arm64
          path: native/staging/osx-arm64
      - name: Verify staged assets
        run: ./eng/Verify-NativeStaging.ps1
      - name: Pack
        run: dotnet pack src/MinigrafSharp/MinigrafSharp.csproj -c Release -p:MinigrafSharpEnablePack=true -o artifacts/packages
      - name: Verify package
        run: |
          $pkg = Get-ChildItem artifacts/packages/MinigrafSharp.*.nupkg | Select-Object -First 1 -ExpandProperty FullName
          ./eng/Verify-Package.ps1 -PackagePath $pkg
      - name: Self-test package verifier
        run: ./eng/Test-PackageVerifier.ps1
      - name: Record package hash
        run: |
          $pkg = Get-ChildItem artifacts/packages/MinigrafSharp.*.nupkg | Select-Object -First 1
          "MinigrafSharp package SHA-256: $((Get-FileHash $pkg.FullName -Algorithm SHA256).Hash)"
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/packages/MinigrafSharp.*.nupkg
          if-no-files-found: error

  # Clean consumers from the exact CI-built package, per OS × TFM; NativeAOT on
  # net10.0 where the runner toolchain supports it.
  consume:
    needs: [pack]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            tfm: net8.0
          - os: windows-latest
            rid: win-x64
            tfm: net10.0
          - os: ubuntu-latest
            rid: linux-x64
            tfm: net8.0
          - os: ubuntu-latest
            rid: linux-x64
            tfm: net10.0
          - os: macos-latest
            rid: osx-arm64
            tfm: net8.0
          - os: macos-latest
            rid: osx-arm64
            tfm: net10.0
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts/packages
      - name: Install Linux NativeAOT toolchain
        if: matrix.os == 'ubuntu-latest' && matrix.tfm == 'net10.0'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Clean consumer ${{ matrix.rid }} / ${{ matrix.tfm }}
        run: |
          $pkg = Get-ChildItem artifacts/packages/MinigrafSharp.*.nupkg | Select-Object -First 1 -ExpandProperty FullName
          $consumerArgs = @{ Package = $pkg; TargetFramework = '${{ matrix.tfm }}' }
          if ('${{ matrix.tfm }}' -eq 'net10.0') {
            $consumerArgs.Aot = $true
            $consumerArgs.Rid = '${{ matrix.rid }}'
          }
          ./eng/Test-PackageConsumer.ps1 @consumerArgs
